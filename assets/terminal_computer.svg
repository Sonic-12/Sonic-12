<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" font-family="Fira Code, Consolas, monospace">

  <defs>
    <!-- loop driver: everything below re-syncs to this -->
    <rect id="loopdriver" width="0" height="0">
      <animate id="loop" attributeName="width" from="0" to="0" dur="9s" begin="0s;loop.end"/>
    </rect>
  </defs>


  <g transform="translate(40,90)">
    <rect x="0" y="0" width="110" height="200" rx="10" fill="#12161a" stroke="#26a5e4" stroke-width="2"/>
    <!-- chip label -->
    <rect x="15" y="18" width="80" height="30" rx="4" fill="#1e2327" stroke="#26a5e4" stroke-width="1"/>
    <text x="55" y="38" text-anchor="middle" fill="#26a5e4" font-size="13" font-weight="bold">CPU</text>

    <!-- vents -->
    <g stroke="#26a5e4" stroke-width="2" opacity="0.55">
      <line x1="15" y1="65" x2="95" y2="65"/>
      <line x1="15" y1="75" x2="95" y2="75"/>
      <line x1="15" y1="85" x2="95" y2="85"/>
      <line x1="15" y1="95" x2="95" y2="95"/>
      <line x1="15" y1="105" x2="95" y2="105"/>
    </g>

    <!-- circuit dots -->
    <g fill="#26a5e4" opacity="0.7">
      <circle cx="25" cy="130" r="2"/>
      <circle cx="40" cy="130" r="2"/>
      <circle cx="55" cy="130" r="2"/>
      <circle cx="70" cy="130" r="2"/>
      <circle cx="85" cy="130" r="2"/>
      <circle cx="25" cy="145" r="2"/>
      <circle cx="55" cy="145" r="2"/>
      <circle cx="85" cy="145" r="2"/>
    </g>

    <!-- power LED, blinking -->
    <circle cx="55" cy="180" r="5" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="55" y="196" text-anchor="middle" fill="#7d8590" font-size="8">PWR</text>
  </g>

  <g transform="translate(190,40)">
    <!-- stand -->
    <rect x="215" y="280" width="20" height="35" fill="#12161a"/>
    <rect x="165" y="313" width="120" height="12" rx="4" fill="#12161a" stroke="#26a5e4" stroke-width="1.5"/>

    <!-- frame -->
    <rect x="0" y="0" width="450" height="280" rx="14" fill="#12161a" stroke="#26a5e4" stroke-width="2.5"/>

    <!-- screen -->
    <rect x="16" y="16" width="418" height="220" rx="6" fill="#0d1117"/>

    <!-- terminal title bar -->
    <rect x="16" y="16" width="418" height="26" rx="6" fill="#161b22"/>
    <circle cx="34" cy="29" r="5" fill="#ff5f56"/>
    <circle cx="52" cy="29" r="5" fill="#ffbd2e"/>
    <circle cx="70" cy="29" r="5" fill="#27c93f"/>
    <text x="225" y="33" text-anchor="middle" fill="#7d8590" font-size="11">lohit@dev: ~</text>

    <g font-size="14" fill="#26a5e4">
      <text x="30" y="72">
        <tspan opacity="0">$</tspan>
        <set attributeName="opacity" to="0" begin="loop.begin"/>
      </text>

      <text x="30" y="72" fill="#7ee787">
        <tspan>$ whoami</tspan>
        <animate attributeName="opacity" values="0;0;1;1;1;1;1;1;0" keyTimes="0;0.02;0.05;0.9;0.92;0.94;0.96;0.98;1" dur="9s" begin="loop.begin" repeatCount="indefinite"/>
      </text>

      <text x="30" y="100" fill="#e6edf3">
        <animate attributeName="opacity" values="0;0;1;1;1;1;1;0" keyTimes="0;0.14;0.17;0.9;0.92;0.94;0.98;1" dur="9s" begin="loop.begin" repeatCount="indefinite"/>
        AlphaSpirit
      </text>

      <text x="30" y="140" fill="#7ee787">
        <animate attributeName="opacity" values="0;0;1;1;1;1;0" keyTimes="0;0.30;0.34;0.9;0.92;0.96;1" dur="9s" begin="loop.begin" repeatCount="indefinite"/>
        $ status --check
      </text>

      <text x="30" y="168" fill="#26a5e4">
        <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.48;0.53;0.9;0.94;1" dur="9s" begin="loop.begin" repeatCount="indefinite"/>
        [OK] Welcome to Devs World!
      </text>

      <text x="30" y="196" fill="#e6edf3">
        <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.63;0.68;0.9;0.94;1" dur="9s" begin="loop.begin" repeatCount="indefinite"/>
        building while sleeping...
      </text>
    </g>


    <rect x="30" y="205" width="9" height="14" fill="#26a5e4">
      <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="x" values="30;170;30;150;30;230;30;250;30" keyTimes="0;0.14;0.30;0.48;0.63;0.72;0.9;0.95;1" dur="9s" begin="loop.begin" repeatCount="indefinite"/>
      <animate attributeName="y" values="205;99;99;139;139;167;167;195;195" keyTimes="0;0.13;0.16;0.29;0.33;0.47;0.52;0.62;1" dur="9s" begin="loop.begin" repeatCount="indefinite"/>
    </rect>

    <!-- base bar -->
    <rect x="16" y="244" width="418" height="20" rx="3" fill="#161b22"/>
    <text x="30" y="258" font-size="10" fill="#7d8590">status: online · uptime: Upto I am Alive</text>
    <circle cx="418" cy="254" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>


  <g transform="translate(220,340)">
    <rect x="0" y="0" width="380" height="16" rx="4" fill="#12161a" stroke="#26a5e4" stroke-width="1"/>
    <g fill="#26a5e4" opacity="0.6">
      <rect x="10" y="4" width="20" height="8" rx="2"/>
      <rect x="35" y="4" width="20" height="8" rx="2"/>
      <rect x="60" y="4" width="20" height="8" rx="2"/>
      <rect x="90" y="4" width="220" height="8" rx="2"/>
      <rect x="315" y="4" width="20" height="8" rx="2"/>
      <rect x="340" y="4" width="20" height="8" rx="2"/>
      <rect x="365" y="4" width="10" height="8" rx="2"/>
    </g>
  </g>
</svg>